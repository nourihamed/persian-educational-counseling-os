          PGUSER: postgres
          PGPASSWORD: postgres

      - name: Workspace archive and capacity release under the runtime role (synthetic)
        run: |
          W=docs/phase2/workspace
          K=a1000000000000000000000000000009
          createdb workspace_archive_test
          psql -X -v ON_ERROR_STOP=1 -d workspace_archive_test -f $W/workspace_schema_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d workspace_archive_test -f $W/workspace_activation_transactions.sql
          psql -X -v ON_ERROR_STOP=1 -d workspace_archive_test -f $W/workspace_governance_events_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d workspace_archive_test -f $W/workspace_archive_transactions.sql
          psql -X -v ON_ERROR_STOP=1 -v workspace_key=$K -d workspace_archive_test -f $W/workspace_roles_setup_draft.sql
          psql -X -v ON_ERROR_STOP=1 -v workspace_key=$K -d workspace_archive_test -f $W/tests/workspace_archive_tests.sql

      - name: Clock discipline — no security decision from a transaction-start clock
        run: |
          set -euo pipefail
          W=docs/phase2/workspace
          R=docs/phase2/workspace/receipts
          K=a1000000000000000000000000000051
          # Its own database: CLK-03 leaves guardian fixtures behind on purpose, because the guardian
          # event tables are append-only (WS-DOM-03) and cannot be cleaned up.
          createdb -h localhost -U postgres workspace_clock_test
          # workspace_operations_draft is loaded too so the CLK-01 catalog scan covers the Batch 8
          # disposition gate, which decides from an effective date.
          for f in workspace_schema_draft workspace_activation_transactions workspace_governance_events_draft workspace_archive_transactions workspace_inbox_projection workspace_transfer_freeze workspace_counselor_scope_draft workspace_principal_assertion_draft workspace_operations_draft workspace_counselor_rls_draft; do
            psql -X -v ON_ERROR_STOP=1 -d workspace_clock_test -f $W/$f.sql
          done
          psql -X -v ON_ERROR_STOP=1 -v workspace_key=$K -d workspace_clock_test -f $W/workspace_roles_setup_draft.sql
          # The receipt drafts are loaded too so the CLK-01 catalog scan covers the consume command.
          psql -X -v ON_ERROR_STOP=1 -d workspace_clock_test -f $R/receipt_00_canonical_payload_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d workspace_clock_test -f $R/receipt_01_schema_draft.sql
          psql -X -v ON_ERROR_STOP=1 -v workspace_key=$K -d workspace_clock_test -f $R/receipt_02_roles_draft.sql
          psql -X -v ON_ERROR_STOP=1 -v workspace_key=$K -d workspace_clock_test -f $R/receipt_03_consume_function_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d workspace_clock_test -f $W/tests/workspace_clock_discipline_tests.sql
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres

      # REPOSITORY CHECK — deliberately not an implementation test. It proves the absence of the secret
      # SHAPES it scans for, not the absence of secrets; real assurance needs a secret-scanning service,
      # which is an operational control outside this repository. Do not count it as test evidence.
      # `!cancelled()`: both repository checks run even when an EARLIER step failed, so each reports its
      # own result instead of being skipped (runs 43725323633 and 43725318826 skipped the register check
      # because the secret scan before it failed). This does NOT soften the outcome: any failed step still
      # fails the job, and these two steps fail it in their own right when they find something.
      - name: No secret or key material in tracked files, committed file names or historical file contents (repository check, NOT implementation evidence)
        if: ${{ !cancelled() }}
        run: python3 -I docs/phase2/tests/check_no_secret_material.py

      # DOCUMENTATION CONSISTENCY CHECK — deliberately not an implementation test.
      # It proves nothing about the schema or any security property. It only stops the two halves of the
      # unresolved-item register from drifting apart, and stops an item being silently marked RESOLVED or
      # marked continuable without a fail-closed condition. Do not count it as test evidence.
      - name: Unresolved-item register consistency (documentation check, NOT implementation evidence)
        if: ${{ !cancelled() }}
        run: python3 -I docs/phase2/tests/check_unresolved_register.py
