name: Phase 2 draft schema tests

on:
  push:
    branches:
      - docs/product-owner-decisions-consolidation-2026-11-07
      - supervisor/phase2-h01-h04-remediation-2026-11-22
  pull_request:
    branches: [main]
    paths:
      - "docs/phase2/**"
      - ".github/workflows/phase2-schema-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-draft-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # FULL history. The repository secret scan reads the content of every historical blob
          # (SEC-REPO-03); in the default shallow checkout it cannot, and it FAILS CLOSED rather than
          # report a history it never read.
          fetch-depth: 0

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Apply Control Plane drafts and run regression suite
        run: |
          createdb control_plane_test
          psql -X -v ON_ERROR_STOP=1 -d control_plane_test -f docs/phase2/control_plane/schema/cp_01_schema_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d control_plane_test -f docs/phase2/control_plane/schema/cp_05_identity_rotation_guard.sql
          psql -X -v ON_ERROR_STOP=1 -d control_plane_test -f docs/phase2/control_plane/schema/cp_07_claim_admission_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d control_plane_test -f docs/phase2/control_plane/schema/cp_02_switch_function_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d control_plane_test -f docs/phase2/control_plane/schema/cp_03_transfer_transitions_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d control_plane_test -f docs/phase2/control_plane/schema/cp_04_transfer_command_idempotency.sql
          psql -X -v ON_ERROR_STOP=1 -d control_plane_test -f docs/phase2/control_plane/schema/cp_06_role_privileges_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d control_plane_test -f docs/phase2/control_plane/tests/cp_30_role_privilege_tests.sql
          psql -X -v ON_ERROR_STOP=1 -d control_plane_test -f docs/phase2/control_plane/tests/cp_10_constraint_tests.sql
          psql -X -v ON_ERROR_STOP=1 -d control_plane_test -f docs/phase2/control_plane/tests/cp_35_approval_event_tests.sql
          bash docs/phase2/control_plane/tests/cp_36_approval_revocation_race.sh control_plane_test

      - name: Apply Control Plane drafts and run concurrent global-identity race
        run: |
          createdb control_plane_race
          psql -X -v ON_ERROR_STOP=1 -d control_plane_race -f docs/phase2/control_plane/schema/cp_01_schema_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d control_plane_race -f docs/phase2/control_plane/schema/cp_05_identity_rotation_guard.sql
          psql -X -v ON_ERROR_STOP=1 -d control_plane_race -f docs/phase2/control_plane/schema/cp_07_claim_admission_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d control_plane_race -f docs/phase2/control_plane/schema/cp_02_switch_function_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d control_plane_race -f docs/phase2/control_plane/schema/cp_03_transfer_transitions_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d control_plane_race -f docs/phase2/control_plane/schema/cp_04_transfer_command_idempotency.sql
          psql -X -v ON_ERROR_STOP=1 -d control_plane_race -f docs/phase2/control_plane/schema/cp_06_role_privileges_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d control_plane_race <<'SQL'
          INSERT INTO workspaces(workspace_id,workspace_type,status) VALUES
            ('a0000000-0000-0000-0000-000000000001','organization','active'),
            ('a0000000-0000-0000-0000-000000000002','independent_counselor','active'),
            ('a0000000-0000-0000-0000-000000000003','organization','active');
          SQL
          bash docs/phase2/control_plane/tests/cp_20_race.sh control_plane_race

      - name: Test Control Plane initial claim admission and concurrency
        run: |
          createdb control_plane_admission_test
          psql -X -v ON_ERROR_STOP=1 -d control_plane_admission_test -f docs/phase2/control_plane/schema/cp_01_schema_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d control_plane_admission_test -f docs/phase2/control_plane/schema/cp_05_identity_rotation_guard.sql
          psql -X -v ON_ERROR_STOP=1 -d control_plane_admission_test -f docs/phase2/control_plane/schema/cp_07_claim_admission_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d control_plane_admission_test -f docs/phase2/control_plane/schema/cp_02_switch_function_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d control_plane_admission_test -f docs/phase2/control_plane/schema/cp_03_transfer_transitions_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d control_plane_admission_test -f docs/phase2/control_plane/schema/cp_04_transfer_command_idempotency.sql
          psql -X -v ON_ERROR_STOP=1 -d control_plane_admission_test -f docs/phase2/control_plane/schema/cp_06_role_privileges_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d control_plane_admission_test -f docs/phase2/control_plane/tests/cp_30_role_privilege_tests.sql
          psql -X -v ON_ERROR_STOP=1 -d control_plane_admission_test -f docs/phase2/control_plane/tests/cp_15_identity_admission_tests.sql
          bash docs/phase2/control_plane/tests/cp_25_claim_admission_race.sh control_plane_admission_test

      - name: Transfer approval separation of duties and the disabled conflict exception
        run: |
          set -euo pipefail
          C=docs/phase2/control_plane
          createdb -h localhost -U postgres cp_approval_separation
          for f in cp_01_schema_draft cp_05_identity_rotation_guard cp_07_claim_admission_draft cp_02_switch_function_draft cp_03_transfer_transitions_draft cp_04_transfer_command_idempotency cp_06_role_privileges_draft cp_11_transfer_approval_command; do
            psql -X -v ON_ERROR_STOP=1 -d cp_approval_separation -f $C/schema/$f.sql
          done
          psql -X -v ON_ERROR_STOP=1 -d cp_approval_separation -f $C/tests/cp_37_approval_separation_tests.sql
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres

      - name: Transfer Saga outbox envelope, delivery leases, dead-letter and re-drive
        run: |
          set -euo pipefail
          C=docs/phase2/control_plane
          createdb -h localhost -U postgres cp_saga_test
          for f in cp_01_schema_draft cp_05_identity_rotation_guard cp_07_claim_admission_draft cp_02_switch_function_draft cp_03_transfer_transitions_draft cp_04_transfer_command_idempotency cp_06_role_privileges_draft cp_12_saga_outbox_delivery; do
            psql -X -v ON_ERROR_STOP=1 -d cp_saga_test -f $C/schema/$f.sql
          done
          psql -X -v ON_ERROR_STOP=1 -d cp_saga_test -f $C/tests/cp_38_saga_outbox_tests.sql
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres

      - name: Workspace Saga inbox and generation-fenced projection
        run: |
          set -euo pipefail
          W=docs/phase2/workspace
          K=a1000000000000000000000000000021
          createdb -h localhost -U postgres workspace_inbox_test
          for f in workspace_schema_draft workspace_activation_transactions workspace_governance_events_draft workspace_archive_transactions workspace_inbox_projection workspace_transfer_freeze; do
            psql -X -v ON_ERROR_STOP=1 -d workspace_inbox_test -f $W/$f.sql
          done
          psql -X -v ON_ERROR_STOP=1 -v workspace_key=$K -d workspace_inbox_test -f $W/workspace_roles_setup_draft.sql
          psql -X -v ON_ERROR_STOP=1 -v workspace_key=$K -d workspace_inbox_test -f $W/tests/workspace_inbox_tests.sql
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres

      - name: Curriculum hierarchy (subtopics) and deletion behaviour
        run: |
          set -euo pipefail
          W=docs/phase2/workspace
          # Its own database: this suite inserts its own subject/chapter/topic chain and must not collide
          # with the schema regression suite's fixtures.
          createdb -h localhost -U postgres workspace_curriculum_test
          psql -X -v ON_ERROR_STOP=1 -d workspace_curriculum_test -f $W/workspace_schema_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d workspace_curriculum_test -f $W/tests/workspace_curriculum_tests.sql
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres

      - name: Workspace source transfer freeze and database write barrier
        run: |
          set -euo pipefail
          W=docs/phase2/workspace
          K=a1000000000000000000000000000031
          createdb -h localhost -U postgres workspace_freeze_test
          for f in workspace_schema_draft workspace_activation_transactions workspace_governance_events_draft workspace_archive_transactions workspace_inbox_projection workspace_transfer_freeze; do
            psql -X -v ON_ERROR_STOP=1 -d workspace_freeze_test -f $W/$f.sql
          done
          psql -X -v ON_ERROR_STOP=1 -v workspace_key=$K -d workspace_freeze_test -f $W/workspace_roles_setup_draft.sql
          psql -X -v ON_ERROR_STOP=1 -v workspace_key=$K -d workspace_freeze_test -f $W/tests/workspace_transfer_freeze_tests.sql
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres

      - name: Workspace in-flight transaction barrier race (both modes)
        run: |
          set -euo pipefail
          W=docs/phase2/workspace
          # mode "nofk" is the SENSITIVE one: the in-flight writer touches a student-scoped table that has
          # no foreign key to students, so only the barrier's own FOR SHARE lock can block the freeze.
          # mode "fk" is the realistic path, but PostgreSQL's foreign-key row lock would block the freeze
          # there even with no barrier at all, so it is not evidence on its own. Both are run.
          for m in nofk fk; do
            if [ "$m" = nofk ]; then K=a1000000000000000000000000000041; else K=a1000000000000000000000000000042; fi
            DB=workspace_freeze_race_$m
            createdb -h localhost -U postgres $DB
            for f in workspace_schema_draft workspace_activation_transactions workspace_governance_events_draft workspace_archive_transactions workspace_inbox_projection workspace_transfer_freeze; do
              psql -X -v ON_ERROR_STOP=1 -d $DB -f $W/$f.sql
            done
            psql -X -v ON_ERROR_STOP=1 -v workspace_key=$K -d $DB -f $W/workspace_roles_setup_draft.sql
            bash $W/tests/workspace_freeze_barrier_race.sh $DB $K $m
          done
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres

      - name: Files, notifications, retention, legal hold and the fail-closed disposition gate
        run: |
          set -euo pipefail
          W=docs/phase2/workspace
          K=a1000000000000000000000000000061
          # Its own database: OPS-45 freezes a student for the notification fence test and OPS-48 inserts
          # a SYNTHETIC approved retention policy, neither of which may leak into another suite.
          createdb -h localhost -U postgres workspace_operations_test
          for f in workspace_schema_draft workspace_activation_transactions workspace_governance_events_draft workspace_archive_transactions workspace_inbox_projection workspace_transfer_freeze workspace_counselor_scope_draft workspace_operations_draft; do
            psql -X -v ON_ERROR_STOP=1 -d workspace_operations_test -f $W/$f.sql
          done
          psql -X -v ON_ERROR_STOP=1 -v workspace_key=$K -d workspace_operations_test -f $W/workspace_roles_setup_draft.sql
          psql -X -v ON_ERROR_STOP=1 -v workspace_key=$K -d workspace_operations_test -f $W/tests/workspace_operations_tests.sql
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres

      - name: Counselor-to-counselor isolation (WS-ISO-01) — boundary, signed principal assertions (test-only key), row-level security
        run: |
          set -euo pipefail
          W=docs/phase2/workspace
          K=a1000000000000000000000000000062
          createdb -h localhost -U postgres workspace_counselor_isolation_test
          for f in workspace_schema_draft workspace_activation_transactions workspace_governance_events_draft workspace_archive_transactions workspace_inbox_projection workspace_transfer_freeze workspace_counselor_scope_draft workspace_principal_assertion_draft workspace_operations_draft workspace_counselor_rls_draft; do
            psql -X -v ON_ERROR_STOP=1 -d workspace_counselor_isolation_test -f $W/$f.sql
          done
          psql -X -v ON_ERROR_STOP=1 -v workspace_key=$K -d workspace_counselor_isolation_test -f $W/workspace_roles_setup_draft.sql
          psql -X -v ON_ERROR_STOP=1 -v workspace_key=$K -d workspace_counselor_isolation_test -f $W/tests/workspace_counselor_isolation_tests.sql
          # WS-ISO-01 decision B: signed principal assertions (test-only key) and row-level security bound to
          # the verified principal; ISO-GAP-01..03 asserted closed as each counselor's own identity
          psql -X -v ON_ERROR_STOP=1 -v workspace_key=$K -d workspace_counselor_isolation_test -f $W/tests/workspace_principal_assertion_tests.sql
          bash $W/tests/workspace_principal_assertion_race.sh workspace_counselor_isolation_test $K
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres

      - name: Normalized PlanItem data model (WS-PLAN-01, decision B) — fail-closed actors, privileged-identity membership (F-05), concurrent-transition race, historical-row migration, role bootstrap validation (F-05)
        run: |
          set -euo pipefail
          W=docs/phase2/workspace
          K=a1000000000000000000000000000063
          load() {
            createdb -h localhost -U postgres "$1"
            for f in workspace_schema_draft workspace_activation_transactions workspace_governance_events_draft workspace_archive_transactions workspace_inbox_projection workspace_transfer_freeze workspace_counselor_scope_draft workspace_principal_assertion_draft workspace_plan_items_draft workspace_operations_draft workspace_counselor_rls_draft; do
              psql -X -v ON_ERROR_STOP=1 -d "$1" -f $W/$f.sql
            done
            psql -X -v ON_ERROR_STOP=1 -v workspace_key=$K -d "$1" -f $W/workspace_roles_setup_draft.sql
          }
          load workspace_plan_items_test
          psql -X -v ON_ERROR_STOP=1 -v workspace_key=$K -d workspace_plan_items_test -f $W/tests/workspace_plan_items_tests.sql
          # F-05: adversarial role membership, SET ROLE, grant/alter/replace attempts, against the same database
          psql -X -v ON_ERROR_STOP=1 -v workspace_key=$K -d workspace_plan_items_test -f $W/tests/workspace_plan_identity_membership_tests.sql
          # The race needs its own database: it adds a scratch signal table and its fixtures.
          load workspace_plan_items_race
          bash $W/tests/workspace_plan_item_status_race.sh workspace_plan_items_race $K
          # F-04: the migration must be safe on rows that exist BEFORE it runs, so historical rows are loaded
          # between the base drafts and the plan draft.
          createdb -h localhost -U postgres workspace_plan_items_migration
          for f in workspace_schema_draft workspace_activation_transactions workspace_governance_events_draft workspace_archive_transactions workspace_inbox_projection workspace_transfer_freeze workspace_counselor_scope_draft workspace_principal_assertion_draft; do
            psql -X -v ON_ERROR_STOP=1 -d workspace_plan_items_migration -f $W/$f.sql
          done
          psql -X -v ON_ERROR_STOP=1 -d workspace_plan_items_migration -f $W/tests/workspace_plan_items_migration_fixture.sql
          for f in workspace_plan_items_draft workspace_operations_draft workspace_counselor_rls_draft; do
            psql -X -v ON_ERROR_STOP=1 -d workspace_plan_items_migration -f $W/$f.sql
          done
          psql -X -v ON_ERROR_STOP=1 -v workspace_key=$K -d workspace_plan_items_migration -f $W/workspace_roles_setup_draft.sql
          psql -X -v ON_ERROR_STOP=1 -v workspace_key=$K -d workspace_plan_items_migration -f $W/tests/workspace_plan_items_migration_tests.sql
          # F-05: the bootstrap must abort on unsafe PRE-EXISTING privileged roles (own databases and keys)
          bash $W/tests/workspace_plan_identity_bootstrap_tests.sh
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres

      - name: Apply Workspace draft and run schema regression suite
        run: |
          createdb workspace_test
          psql -X -v ON_ERROR_STOP=1 -d workspace_test -f docs/phase2/workspace/workspace_schema_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d workspace_test -f docs/phase2/workspace/workspace_activation_transactions.sql
          psql -X -v ON_ERROR_STOP=1 -d workspace_test -f docs/phase2/workspace/workspace_governance_events_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d workspace_test -f docs/phase2/workspace/tests/workspace_schema_tests.sql
          psql -X -v ON_ERROR_STOP=1 -d workspace_test -f docs/phase2/workspace/tests/workspace_assessment_guardian_tests.sql
          psql -X -v ON_ERROR_STOP=1 -d workspace_test -f docs/phase2/workspace/tests/workspace_assessment_version_question_tests.sql
          psql -X -v ON_ERROR_STOP=1 -d workspace_test -f docs/phase2/workspace/tests/workspace_activity_source_tests.sql
          bash docs/phase2/workspace/tests/workspace_assessment_submit_race.sh workspace_test
          # Batch 4: exam definition versions, per-subject results reconciling with the aggregate,
          # append-only analysis versions, and the explicit scoring algorithm version. Its own database,
          # because it loads an additional draft and builds its own exam blueprint fixtures.
          createdb workspace_assessment_exam_test
          for f in workspace_schema_draft workspace_activation_transactions workspace_governance_events_draft workspace_assessment_exam_draft; do
            psql -X -v ON_ERROR_STOP=1 -d workspace_assessment_exam_test -f docs/phase2/workspace/$f.sql
          done
          psql -X -v ON_ERROR_STOP=1 -d workspace_assessment_exam_test -f docs/phase2/workspace/tests/workspace_assessment_exam_tests.sql

      - name: Test Workspace governance event ledger
        run: |
          createdb workspace_governance_test
          psql -X -v ON_ERROR_STOP=1 -d workspace_governance_test -f docs/phase2/workspace/workspace_schema_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d workspace_governance_test -f docs/phase2/workspace/workspace_governance_events_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d workspace_governance_test -f docs/phase2/workspace/tests/workspace_governance_event_tests.sql

      - name: Test atomic activation, credit and capacity rollback
        run: |
          createdb workspace_activation_test
          psql -X -v ON_ERROR_STOP=1 -d workspace_activation_test -f docs/phase2/workspace/workspace_schema_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d workspace_activation_test -f docs/phase2/workspace/workspace_activation_transactions.sql
          psql -X -v ON_ERROR_STOP=1 -d workspace_activation_test -f docs/phase2/workspace/tests/workspace_activation_tests.sql

      - name: Test concurrent activation and credit serialization
        run: |
          createdb workspace_activation_race
          psql -X -v ON_ERROR_STOP=1 -d workspace_activation_race -f docs/phase2/workspace/workspace_schema_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d workspace_activation_race -f docs/phase2/workspace/workspace_activation_transactions.sql
          bash docs/phase2/workspace/tests/workspace_activation_race.sh workspace_activation_race

      - name: Test competing enrollments for final active-student capacity slot
        run: |
          createdb workspace_capacity_race
          psql -X -v ON_ERROR_STOP=1 -d workspace_capacity_race -f docs/phase2/workspace/workspace_schema_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d workspace_capacity_race -f docs/phase2/workspace/workspace_activation_transactions.sql
          bash docs/phase2/workspace/tests/workspace_capacity_last_slot_race.sh workspace_capacity_race

      - name: Test per-Workspace database roles and cross-database denial
        run: |
          createdb workspace_other
          psql -X -v ON_ERROR_STOP=1 -d workspace_other -f docs/phase2/workspace/workspace_schema_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d workspace_other -f docs/phase2/workspace/workspace_activation_transactions.sql
          psql -X -v ON_ERROR_STOP=1 -d workspace_other -f docs/phase2/workspace/workspace_governance_events_draft.sql
          psql -X -v ON_ERROR_STOP=1 -v workspace_key=a1000000000000000000000000000001 -d workspace_test -f docs/phase2/workspace/workspace_roles_setup_draft.sql
          psql -X -v ON_ERROR_STOP=1 -v workspace_key=a1000000000000000000000000000002 -d workspace_other -f docs/phase2/workspace/workspace_roles_setup_draft.sql
          psql -X -v ON_ERROR_STOP=1 -v workspace_key=a1000000000000000000000000000001 -v other_workspace_key=a1000000000000000000000000000002 -v other_database=workspace_other -d workspace_test -f docs/phase2/workspace/tests/workspace_role_privilege_tests.sql
          psql -X -v ON_ERROR_STOP=1 -v workspace_key=a1000000000000000000000000000002 -v other_workspace_key=a1000000000000000000000000000001 -v other_database=workspace_test -d workspace_other -f docs/phase2/workspace/tests/workspace_role_privilege_tests.sql

      - name: Governance proof receipts, verifier boundary and concurrency (synthetic, Issue #13)
        run: |
          K=a1000000000000000000000000000001
          W=docs/phase2/workspace
          R=docs/phase2/workspace/receipts
          createdb receipt_test
          psql -X -v ON_ERROR_STOP=1 -d receipt_test -f $W/workspace_schema_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d receipt_test -f $W/workspace_activation_transactions.sql
          psql -X -v ON_ERROR_STOP=1 -d receipt_test -f $W/workspace_governance_events_draft.sql
          psql -X -v ON_ERROR_STOP=1 -v workspace_key=$K -d receipt_test -f $W/workspace_roles_setup_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d receipt_test -f $R/receipt_00_canonical_payload_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d receipt_test -f $R/receipt_01_schema_draft.sql
          psql -X -v ON_ERROR_STOP=1 -v workspace_key=$K -d receipt_test -f $R/receipt_02_roles_draft.sql
          psql -X -v ON_ERROR_STOP=1 -v workspace_key=$K -d receipt_test -f $R/receipt_03_consume_function_draft.sql
          psql -X -v ON_ERROR_STOP=1 -v workspace_key=$K -d receipt_test -f $R/tests/receipt_10_tests.sql
          psql -X -v ON_ERROR_STOP=1 -v workspace_key=$K -d receipt_test -f $R/tests/receipt_30_integrity_tests.sql
          psql -X -v ON_ERROR_STOP=1 -v workspace_key=$K -d receipt_test -f $R/tests/receipt_40_canonical_vectors_tests.sql
          psql -X -v ON_ERROR_STOP=1 -v workspace_key=$K -d receipt_test -f $R/tests/receipt_50_h03_tests.sql
          # Freshness of the receipt validity window. The defect this covers was demonstrated: with now()
          # an expired receipt was consumed and applied. These tests take ~8s of deliberate waiting.
          psql -X -v ON_ERROR_STOP=1 -v workspace_key=$K -d receipt_test -f $R/tests/receipt_60_freshness_tests.sql
          # Batch 6 adversarial review, asserted from the catalog. This step is the only one that has every
          # role AND every SECURITY DEFINER function loaded, which is what SEC-01..SEC-10 need.
          psql -X -v ON_ERROR_STOP=1 -v workspace_key=$K -d receipt_test -c "SET app.workspace_key='$K'" -f $W/tests/workspace_privilege_hardening_tests.sql
          createdb receipt_race
          psql -X -v ON_ERROR_STOP=1 -d receipt_race -f $W/workspace_schema_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d receipt_race -f $W/workspace_activation_transactions.sql
          psql -X -v ON_ERROR_STOP=1 -d receipt_race -f $W/workspace_governance_events_draft.sql
          psql -X -v ON_ERROR_STOP=1 -v workspace_key=$K -d receipt_race -f $W/workspace_roles_setup_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d receipt_race -f $R/receipt_00_canonical_payload_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d receipt_race -f $R/receipt_01_schema_draft.sql
          psql -X -v ON_ERROR_STOP=1 -v workspace_key=$K -d receipt_race -f $R/receipt_02_roles_draft.sql
          psql -X -v ON_ERROR_STOP=1 -v workspace_key=$K -d receipt_race -f $R/receipt_03_consume_function_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d receipt_race -c "INSERT INTO workspace_profile(singleton,workspace_id,workspace_type) VALUES(true,'a9100000-0000-0000-0000-000000000001','organization'); INSERT INTO workspace_memberships(membership_id,platform_user_id,status) VALUES ('b9100000-0000-0000-0000-000000000001','c9100000-0000-0000-0000-000000000001','active'),('b9100000-0000-0000-0000-000000000003','c9100000-0000-0000-0000-000000000003','active');"
          bash $R/tests/receipt_20_race.sh receipt_race $K $R/tests

      - name: Verifier boundary tests (test doubles only; production verifier is fail-closed)
        run: |
          cd docs/phase2/workspace/receipts/verifier_interface/tests
          python3 -m unittest -v test_verifier_contract.py
          cd ../canonical
          python3 -m unittest -v test_vectors_v1.py

      - name: Control Plane commands under real executor roles; contact change and its race (synthetic)
        run: |
          C=docs/phase2/control_plane
          for DB in control_plane_executor_test control_plane_contact_test; do
            createdb $DB
            for f in cp_01_schema_draft cp_05_identity_rotation_guard cp_07_claim_admission_draft cp_02_switch_function_draft cp_03_transfer_transitions_draft cp_04_transfer_command_idempotency cp_06_role_privileges_draft; do
              psql -X -v ON_ERROR_STOP=1 -d $DB -f $C/schema/$f.sql
            done
          done
          psql -X -v ON_ERROR_STOP=1 -d control_plane_executor_test -f $C/tests/cp_45_executor_identity_tests.sql
          psql -X -v ON_ERROR_STOP=1 -d control_plane_contact_test -f $C/schema/cp_08_contact_change_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d control_plane_contact_test -f $C/schema/cp_09_contact_change_roles_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d control_plane_contact_test -f $C/tests/cp_30_role_privilege_tests.sql
          psql -X -v ON_ERROR_STOP=1 -d control_plane_contact_test -f $C/tests/cp_40_contact_change_tests.sql
          bash $C/tests/cp_46_contact_change_race.sh control_plane_contact_test
          # Freshness of the one-time contact-change proof window. Reuses cp_40's helpers and fixtures,
          # so it must run after it in the same database. Takes ~4s of deliberate waiting.
          psql -X -v ON_ERROR_STOP=1 -d control_plane_contact_test -f $C/tests/cp_47_freshness_tests.sql
          # Contact confidentiality and key-material assertions (Batch 7).
          psql -X -v ON_ERROR_STOP=1 -d control_plane_contact_test -f $C/tests/cp_49_contact_confidentiality_tests.sql
          # Contact identity concurrency, the two races the brief listed as NOT RUN. Each runs in its OWN
          # fresh database: race A completes an HMAC rotation and race B moves an ownership generation, so
          # sharing a database made one race abort on preconditions the other had changed.
          for m in a b; do
            DB=control_plane_cid_$m
            createdb -h localhost -U postgres $DB
            for f in cp_01_schema_draft cp_05_identity_rotation_guard cp_07_claim_admission_draft cp_02_switch_function_draft cp_03_transfer_transitions_draft cp_04_transfer_command_idempotency cp_06_role_privileges_draft cp_08_contact_change_draft cp_09_contact_change_roles_draft; do
              psql -X -v ON_ERROR_STOP=1 -d $DB -f $C/schema/$f.sql
            done
            psql -X -v ON_ERROR_STOP=1 -d $DB -f $C/tests/cp_30_role_privilege_tests.sql
            psql -X -v ON_ERROR_STOP=1 -d $DB -f $C/tests/cp_40_contact_change_tests.sql
            bash $C/tests/cp_48_contact_identity_race.sh $DB $m
          done

      - name: Student Credit entitlement lifecycle (archive return, reserved credit, reactivation)
        run: |
          set -euo pipefail
          W=docs/phase2/workspace
          K=a1000000000000000000000000000011
          createdb -h localhost -U postgres workspace_credit_test
          createdb -h localhost -U postgres workspace_credit_lock_race
          psql -X -v ON_ERROR_STOP=1 -d workspace_credit_test -f $W/workspace_schema_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d workspace_credit_test -f $W/workspace_activation_transactions.sql
          psql -X -v ON_ERROR_STOP=1 -d workspace_credit_test -f $W/workspace_governance_events_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d workspace_credit_test -f $W/workspace_archive_transactions.sql
          psql -X -v ON_ERROR_STOP=1 -v workspace_key=$K -d workspace_credit_test -f $W/workspace_roles_setup_draft.sql
          psql -X -v ON_ERROR_STOP=1 -v workspace_key=$K -d workspace_credit_test -f $W/tests/workspace_credit_entitlement_tests.sql
          # Ledger invariants that had no test at all before Batch 3, including the central one: the
          # spendable balance can never go negative. Runs after the suite above and reuses its fixtures.
          psql -X -v ON_ERROR_STOP=1 -v workspace_key=$K -d workspace_credit_test -f $W/tests/workspace_credit_ledger_invariant_tests.sql
          # The concurrency half of that invariant: two students racing for the last credit.
          KU=a1000000000000000000000000000013
          createdb workspace_credit_last_unit
          for f in workspace_schema_draft workspace_activation_transactions workspace_governance_events_draft workspace_archive_transactions; do
            psql -X -v ON_ERROR_STOP=1 -d workspace_credit_last_unit -f $W/$f.sql
          done
          psql -X -v ON_ERROR_STOP=1 -v workspace_key=$KU -d workspace_credit_last_unit -f $W/workspace_roles_setup_draft.sql
          bash $W/tests/workspace_credit_last_unit_race.sh workspace_credit_last_unit $KU
          KL=a1000000000000000000000000000012
          for f in workspace_schema_draft workspace_activation_transactions workspace_governance_events_draft workspace_archive_transactions; do
            psql -X -v ON_ERROR_STOP=1 -d workspace_credit_lock_race -f $W/$f.sql
          done
          psql -X -v ON_ERROR_STOP=1 -v workspace_key=$KL -d workspace_credit_lock_race -f $W/workspace_roles_setup_draft.sql
          bash $W/tests/workspace_credit_lock_boundary_race.sh workspace_credit_lock_race $KL
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres

      - name: Concurrent reactivation on one reserved entitlement
        run: |
