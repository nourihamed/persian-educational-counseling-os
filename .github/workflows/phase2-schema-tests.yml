name: Phase 2 draft schema tests

on:
  push:
    branches:
      - docs/product-owner-decisions-consolidation-2026-11-07
  pull_request:
    branches: [main]
    paths:
      - "docs/phase2/**"
      - ".github/workflows/phase2-schema-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-draft-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Apply Control Plane drafts and run regression suite
        run: |
          createdb control_plane_test
          psql -X -v ON_ERROR_STOP=1 -d control_plane_test -f docs/phase2/control_plane/schema/cp_01_schema_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d control_plane_test -f docs/phase2/control_plane/schema/cp_05_identity_rotation_guard.sql
          psql -X -v ON_ERROR_STOP=1 -d control_plane_test -f docs/phase2/control_plane/schema/cp_07_claim_admission_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d control_plane_test -f docs/phase2/control_plane/schema/cp_02_switch_function_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d control_plane_test -f docs/phase2/control_plane/schema/cp_03_transfer_transitions_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d control_plane_test -f docs/phase2/control_plane/schema/cp_04_transfer_command_idempotency.sql
          psql -X -v ON_ERROR_STOP=1 -d control_plane_test -f docs/phase2/control_plane/schema/cp_06_role_privileges_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d control_plane_test -f docs/phase2/control_plane/tests/cp_30_role_privilege_tests.sql
          psql -X -v ON_ERROR_STOP=1 -d control_plane_test -f docs/phase2/control_plane/tests/cp_10_constraint_tests.sql

      - name: Apply Control Plane drafts and run concurrent global-identity race
        run: |
          createdb control_plane_race
          psql -X -v ON_ERROR_STOP=1 -d control_plane_race -f docs/phase2/control_plane/schema/cp_01_schema_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d control_plane_race -f docs/phase2/control_plane/schema/cp_05_identity_rotation_guard.sql
          psql -X -v ON_ERROR_STOP=1 -d control_plane_race -f docs/phase2/control_plane/schema/cp_07_claim_admission_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d control_plane_race -f docs/phase2/control_plane/schema/cp_02_switch_function_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d control_plane_race -f docs/phase2/control_plane/schema/cp_03_transfer_transitions_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d control_plane_race -f docs/phase2/control_plane/schema/cp_04_transfer_command_idempotency.sql
          psql -X -v ON_ERROR_STOP=1 -d control_plane_race -f docs/phase2/control_plane/schema/cp_06_role_privileges_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d control_plane_race <<'SQL'
          INSERT INTO workspaces(workspace_id,workspace_type,status) VALUES
            ('a0000000-0000-0000-0000-000000000001','organization','active'),
            ('a0000000-0000-0000-0000-000000000002','independent_counselor','active'),
            ('a0000000-0000-0000-0000-000000000003','organization','active');
          SQL
          bash docs/phase2/control_plane/tests/cp_20_race.sh control_plane_race

      - name: Test Control Plane initial claim admission and concurrency
        run: |
          createdb control_plane_admission_test
          psql -X -v ON_ERROR_STOP=1 -d control_plane_admission_test -f docs/phase2/control_plane/schema/cp_01_schema_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d control_plane_admission_test -f docs/phase2/control_plane/schema/cp_05_identity_rotation_guard.sql
          psql -X -v ON_ERROR_STOP=1 -d control_plane_admission_test -f docs/phase2/control_plane/schema/cp_07_claim_admission_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d control_plane_admission_test -f docs/phase2/control_plane/schema/cp_02_switch_function_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d control_plane_admission_test -f docs/phase2/control_plane/schema/cp_03_transfer_transitions_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d control_plane_admission_test -f docs/phase2/control_plane/schema/cp_04_transfer_command_idempotency.sql
          psql -X -v ON_ERROR_STOP=1 -d control_plane_admission_test -f docs/phase2/control_plane/schema/cp_06_role_privileges_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d control_plane_admission_test -f docs/phase2/control_plane/tests/cp_30_role_privilege_tests.sql
          psql -X -v ON_ERROR_STOP=1 -d control_plane_admission_test -f docs/phase2/control_plane/tests/cp_15_identity_admission_tests.sql
          bash docs/phase2/control_plane/tests/cp_25_claim_admission_race.sh control_plane_admission_test

      - name: Apply Workspace draft and run schema regression suite
        run: |
          createdb workspace_test
          psql -X -v ON_ERROR_STOP=1 -d workspace_test -f docs/phase2/workspace/workspace_schema_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d workspace_test -f docs/phase2/workspace/workspace_activation_transactions.sql
          psql -X -v ON_ERROR_STOP=1 -d workspace_test -f docs/phase2/workspace/workspace_governance_events_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d workspace_test -f docs/phase2/workspace/tests/workspace_schema_tests.sql

      - name: Test Workspace governance event ledger
        run: |
          createdb workspace_governance_test
          psql -X -v ON_ERROR_STOP=1 -d workspace_governance_test -f docs/phase2/workspace/workspace_schema_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d workspace_governance_test -f docs/phase2/workspace/workspace_governance_events_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d workspace_governance_test -f docs/phase2/workspace/tests/workspace_governance_event_tests.sql

      - name: Test atomic activation, credit and capacity rollback
        run: |
          createdb workspace_activation_test
          psql -X -v ON_ERROR_STOP=1 -d workspace_activation_test -f docs/phase2/workspace/workspace_schema_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d workspace_activation_test -f docs/phase2/workspace/workspace_activation_transactions.sql
          psql -X -v ON_ERROR_STOP=1 -d workspace_activation_test -f docs/phase2/workspace/tests/workspace_activation_tests.sql

      - name: Test concurrent activation and credit serialization
        run: |
          createdb workspace_activation_race
          psql -X -v ON_ERROR_STOP=1 -d workspace_activation_race -f docs/phase2/workspace/workspace_schema_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d workspace_activation_race -f docs/phase2/workspace/workspace_activation_transactions.sql
          bash docs/phase2/workspace/tests/workspace_activation_race.sh workspace_activation_race

      - name: Test competing enrollments for final active-student capacity slot
        run: |
          createdb workspace_capacity_race
          psql -X -v ON_ERROR_STOP=1 -d workspace_capacity_race -f docs/phase2/workspace/workspace_schema_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d workspace_capacity_race -f docs/phase2/workspace/workspace_activation_transactions.sql
          bash docs/phase2/workspace/tests/workspace_capacity_last_slot_race.sh workspace_capacity_race

      - name: Test per-Workspace database roles and cross-database denial
        run: |
          createdb workspace_other
          psql -X -v ON_ERROR_STOP=1 -d workspace_other -f docs/phase2/workspace/workspace_schema_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d workspace_other -f docs/phase2/workspace/workspace_activation_transactions.sql
          psql -X -v ON_ERROR_STOP=1 -d workspace_other -f docs/phase2/workspace/workspace_governance_events_draft.sql
          psql -X -v ON_ERROR_STOP=1 -v workspace_key=a1000000000000000000000000000001 -d workspace_test -f docs/phase2/workspace/workspace_roles_setup_draft.sql
          psql -X -v ON_ERROR_STOP=1 -v workspace_key=a1000000000000000000000000000002 -d workspace_other -f docs/phase2/workspace/workspace_roles_setup_draft.sql
          psql -X -v ON_ERROR_STOP=1 -v workspace_key=a1000000000000000000000000000001 -v other_workspace_key=a1000000000000000000000000000002 -v other_database=workspace_other -d workspace_test -f docs/phase2/workspace/tests/workspace_role_privilege_tests.sql
          psql -X -v ON_ERROR_STOP=1 -v workspace_key=a1000000000000000000000000000002 -v other_workspace_key=a1000000000000000000000000000001 -v other_database=workspace_test -d workspace_other -f docs/phase2/workspace/tests/workspace_role_privilege_tests.sql

      - name: Governance proof receipts, verifier boundary and concurrency (synthetic, Issue #13)
        run: |
          K=a1000000000000000000000000000001
          W=docs/phase2/workspace
          R=docs/phase2/workspace/receipts
          createdb receipt_test
          psql -X -v ON_ERROR_STOP=1 -d receipt_test -f $W/workspace_schema_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d receipt_test -f $W/workspace_activation_transactions.sql
          psql -X -v ON_ERROR_STOP=1 -d receipt_test -f $W/workspace_governance_events_draft.sql
          psql -X -v ON_ERROR_STOP=1 -v workspace_key=$K -d receipt_test -f $W/workspace_roles_setup_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d receipt_test -f $R/receipt_00_canonical_payload_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d receipt_test -f $R/receipt_01_schema_draft.sql
          psql -X -v ON_ERROR_STOP=1 -v workspace_key=$K -d receipt_test -f $R/receipt_02_roles_draft.sql
          psql -X -v ON_ERROR_STOP=1 -v workspace_key=$K -d receipt_test -f $R/receipt_03_consume_function_draft.sql
          psql -X -v ON_ERROR_STOP=1 -v workspace_key=$K -d receipt_test -f $R/tests/receipt_10_tests.sql
          psql -X -v ON_ERROR_STOP=1 -v workspace_key=$K -d receipt_test -f $R/tests/receipt_30_integrity_tests.sql
          psql -X -v ON_ERROR_STOP=1 -v workspace_key=$K -d receipt_test -f $R/tests/receipt_40_canonical_vectors_tests.sql
          createdb receipt_race
          psql -X -v ON_ERROR_STOP=1 -d receipt_race -f $W/workspace_schema_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d receipt_race -f $W/workspace_activation_transactions.sql
          psql -X -v ON_ERROR_STOP=1 -d receipt_race -f $W/workspace_governance_events_draft.sql
          psql -X -v ON_ERROR_STOP=1 -v workspace_key=$K -d receipt_race -f $W/workspace_roles_setup_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d receipt_race -f $R/receipt_00_canonical_payload_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d receipt_race -f $R/receipt_01_schema_draft.sql
          psql -X -v ON_ERROR_STOP=1 -v workspace_key=$K -d receipt_race -f $R/receipt_02_roles_draft.sql
          psql -X -v ON_ERROR_STOP=1 -v workspace_key=$K -d receipt_race -f $R/receipt_03_consume_function_draft.sql
          psql -X -v ON_ERROR_STOP=1 -d receipt_race -c "INSERT INTO workspace_profile(singleton,workspace_id,workspace_type) VALUES(true,'a9100000-0000-0000-0000-000000000001','organization'); INSERT INTO workspace_memberships(membership_id,platform_user_id,status) VALUES ('b9100000-0000-0000-0000-000000000001','c9100000-0000-0000-0000-000000000001','active'),('b9100000-0000-0000-0000-000000000003','c9100000-0000-0000-0000-000000000003','active');"
          bash $R/tests/receipt_20_race.sh receipt_race $K $R/tests

      - name: Verifier boundary tests (test doubles only; production verifier is fail-closed)
        run: |
          cd docs/phase2/workspace/receipts/verifier_interface/tests
          python3 -m unittest -v test_verifier_contract.py
          cd ../canonical
          python3 -m unittest -v test_vectors_v1.py
